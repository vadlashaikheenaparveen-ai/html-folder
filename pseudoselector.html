<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::after{
            content: " DINGI";
            color: brown;
        }
        h1::before{
            color: brown;
            content: "DINGA ";
        }
        h1::first-letter{
            color: rgb(223, 9, 173);
        }
        h1::first-line{
            background-color: aliceblue;
        }
        li::marker{
            content: "😇"
        }
        li::selection{
            background-color: yellow;
        }
       
    </style>
</head>
<body>
    <h1>WEDS</h1>
    <h1>WEDS</h1>
    <h1>WEDS</h1>
    <h1>WEDS</h1>
    <h1>WEDS</h1>
    <ol>
        <li>Web tech</li>
        <li>Java Script</li>
        <li>Java</li>
        <li>Sql</li>
        <li>Python</li>
    </ol>
</body>
</html>
